[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[project]
name = "realtime-meeting-v2"
version = "0.1.0"
description = "Real-time Qwen meeting transcription with automatic Chinese dialect detection, translation, minutes and action items"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.139.2",
  "starlette==1.3.1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.30,<1",
  "webrtcvad-wheels==2.0.14",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }


[project.optional-dependencies]
audio = [
  "torch==2.11.0+cu128",
  "torchaudio==2.11.0+cu128",
  "ctranslate2>=4.5,<5",
  "qwen-asr==0.0.6",
  "funasr>=1.2,<2",
  "huggingface-hub>=0.25,<2",
  "hf-xet>=1.1,<2",
  "opencc-python-reimplemented>=0.1,<1",
  "sentencepiece>=0.2,<1",
]
dev = ["httpx2>=2.10,<3", "pytest>=9.0.3,<10", "pytest-asyncio>=1.3,<2"]
docs = ["python-docx>=1.1,<2"]

[project.scripts]
meeting-v2 = "realtime_meeting.cli:main"

[tool.uv.build-backend]
module-name = "realtime_meeting"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  # Treat every other deprecation as a test failure so new warnings stay visible.
  "error::DeprecationWarning",
  # audioread imports Python 3.11 stdlib modules scheduled for removal in 3.13.
  "ignore:'aifc' is deprecated and slated for removal in Python 3.13:DeprecationWarning:audioread\\.rawread",
  "ignore:'audioop' is deprecated and slated for removal in Python 3.13:DeprecationWarning:audioread\\.rawread",
  "ignore:'sunau' is deprecated and slated for removal in Python 3.13:DeprecationWarning:audioread\\.rawread",
]

[tool.pip-audit]
ignore-vulns = [
  # setuptools<82 is required by the pinned CUDA 12.8 torch wheel. This issue
  # only affects Unicode-normalization collisions while building an sdist on
  # macOS; production and model preparation run on Windows from uv.lock.
  "PYSEC-2026-3447",
]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
