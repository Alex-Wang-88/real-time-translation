[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-meeting-translator"
version = "0.1.0"
description = "Local real-time multilingual meeting transcription and Simplified Chinese translation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "faster-whisper>=1.2,<2",
  "httpx>=0.28,<1",
  "lingua-language-detector>=2.1,<3",
  "numpy>=1.26,<3",
  "opencc-python-reimplemented>=0.1.7,<1",
  "PyQt6>=6.7,<7",
  "pycaw>=20240210,<20260000",
  "python-dotenv>=1.1,<2",
  "resemblyzer>=0.1.4,<1",
  "sentencepiece>=0.2,<1",
  "sounddevice>=0.5,<1",
  "uvicorn[standard]>=0.35,<1",
  "websockets>=13,<16",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.24,<1"]

[project.scripts]
meeting-live = "realtime_meeting.cli:main"
meeting-desktop = "realtime_meeting.desktop:main"

[tool.setuptools.packages.find]
include = ["realtime_meeting*"]

[tool.setuptools.package-data]
realtime_meeting = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
