[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-meeting-translator"
version = "0.1.0"
description = "Local real-time multilingual meeting transcription and Simplified Chinese translation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "ctranslate2==4.8.1",
  "fastapi==0.141.1",
  "faster-whisper==1.2.1",
  "funasr==1.4.1",
  "huggingface-hub==1.27.0",
  "httpx==0.28.1",
  "lingua-language-detector==2.1.1",
  "numpy==2.4.6",
  "opencc-python-reimplemented==0.1.7",
  "python-dotenv==1.2.2",
  "resemblyzer==0.1.4",
  "sentencepiece==0.2.2",
  "torch==2.11.0+cu128",
  "uvicorn[standard]==0.52.1",
  "websockets==15.0.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-asyncio==0.26.0"]

[project.scripts]
meeting-live = "realtime_meeting.cli:main"
meeting-web = "realtime_meeting.cli:main"

[tool.setuptools.packages.find]
include = ["realtime_meeting*"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.setuptools.package-data]
realtime_meeting = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
