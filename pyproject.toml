[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-meeting-v2"
version = "0.1.0"
description = "Real-time Chinese, English and German meeting transcription, translation, minutes and action items"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.115.0",
  "starlette>=0.37.2,<0.39.0",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.30,<1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }


[project.optional-dependencies]
audio = [
  "torch==2.11.0+cu128",
  "torchaudio==2.11.0+cu128",
  "ctranslate2>=4.5,<5",
  "faster-whisper>=1.1,<2",
  "funasr>=1.2,<2",
  "huggingface-hub>=0.25,<2",
  "lingua-language-detector>=2.0,<3",
  "opencc-python-reimplemented>=0.1,<1",
  "resemblyzer>=0.1,<1",
  "sentencepiece>=0.2,<1",
]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[project.scripts]
meeting-v2 = "realtime_meeting.cli:main"

[tool.setuptools.packages.find]
include = ["realtime_meeting*"]

[tool.setuptools.package-data]
realtime_meeting = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  # Treat every other deprecation as a test failure so new warnings stay visible.
  "error::DeprecationWarning",
  # Resemblyzer 0.1.4 still imports SciPy's legacy morphology namespace.
  "ignore:Please import `binary_dilation` from the `scipy.ndimage` namespace.*:DeprecationWarning:resemblyzer\\.audio",
  # audioread imports Python 3.11 stdlib modules scheduled for removal in 3.13.
  "ignore:'aifc' is deprecated and slated for removal in Python 3.13:DeprecationWarning:audioread\\.rawread",
  "ignore:'audioop' is deprecated and slated for removal in Python 3.13:DeprecationWarning:audioread\\.rawread",
  "ignore:'sunau' is deprecated and slated for removal in Python 3.13:DeprecationWarning:audioread\\.rawread",
]
