<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="实时中文、英文、德文会议记录、翻译、会议纪要和行动项" />
    <title>会记 v2 · 实时会议记录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/styles.css?v=7" />
    <link rel="stylesheet" href="/static/styles-fixes.css?v=2" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></div>
          <div>
            <h1>会记</h1>
          </div>
        </div>

        <button id="newMeeting" class="primary-button full" type="button" disabled>＋ 新建会议</button>

        <div class="sidebar-section">
          <div class="section-heading">
            <span>会议历史</span>
            <button id="refreshMeetings" class="icon-button" type="button" title="刷新会议历史" aria-label="刷新会议历史">↻</button>
          </div>
          <label class="search-box">
            <span aria-hidden="true">⌕</span>
            <input id="meetingSearch" type="search" placeholder="搜索会议" autocomplete="off" />
          </label>
          <div id="meetingList" class="meeting-list" aria-live="polite">
            <div class="sidebar-empty">还没有会议记录</div>
          </div>
        </div>

        <div class="sidebar-footer">
          <div class="system-status"><span id="statusDot" class="status-dot"></span><span id="systemStatus">正在连接本机服务</span></div>
        </div>
      </aside>

      <main class="main-column">
        <header class="topbar">
          <div>
            <h2 id="pageTitle" aria-live="polite"></h2>
            <p id="pageSubtitle" class="muted"></p>
          </div>
          <div class="topbar-actions">
            <span id="connectionBadge" class="badge neutral">服务检查中</span>
            <button id="deleteMeeting" class="ghost-button danger" type="button" hidden>删除会议</button>
          </div>
        </header>

        <section id="welcomePanel" class="welcome-panel">
          <div class="welcome-copy">
            <p>支持中文、英文、德文原文转写；英文和德文会自动翻译为简体中文。</p>
          </div>
          <div class="welcome-form">
            <label for="meetingTitle">会议名称</label>
            <input id="meetingTitle" type="text" maxlength="200" placeholder="例如：产品周会 / Q3 规划" />
            <label for="hotwords">专业词、姓名或产品名 <span>可选</span></label>
            <input id="hotwords" type="text" maxlength="2000" placeholder="用逗号分隔，帮助识别专有名词" />
            <button id="startMeeting" class="primary-button" type="button" disabled>开始会议 <span>→</span></button>
          </div>
        </section>

        <section id="meetingPanel" class="meeting-panel" hidden>
          <div class="recording-card">
            <div class="recording-info">
              <div class="recording-row"><span id="recordingIndicator" class="recording-indicator"></span><strong id="recordingState">准备中</strong><time id="timer">00:00:00</time></div>
              <p id="recordingHint" class="muted">请允许浏览器访问麦克风。</p>
            </div>
            <div class="recording-center">
              <button id="recordButton" class="record-button" type="button" aria-label="停止会议"><span></span></button>
              <div class="level-meter"><span id="levelBar"></span></div>
              <span id="levelText">麦克风等待中</span>
            </div>
            <div class="recording-controls">
              <label for="inputDevice">输入设备</label>
              <div class="device-row"><select id="inputDevice"><option value="">系统默认设备</option></select><button id="refreshDevices" class="icon-button" type="button" title="刷新设备" aria-label="刷新设备">↻</button></div>
              <span id="languageIndicator" class="language-indicator">等待语音</span>
            </div>
          </div>

          <section id="postprocessPanel" class="postprocess-panel panel-card" hidden>
            <div class="panel-heading compact">
              <div><h3>后台处理</h3><p id="postprocessMessage" class="muted">等待处理</p></div>
              <span id="postprocessBadge" class="badge neutral">未开始</span>
            </div>
            <div class="postprocess-progress"><span id="postprocessProgressBar"></span></div>
            <div id="postprocessStages" class="postprocess-stages"></div>
            <div class="result-actions"><button id="retryPostprocess" class="text-button" type="button" hidden>重试后台处理</button></div>
          </section>

          <div id="notice" class="notice" hidden role="alert"></div>

          <section class="transcript-panel panel-card">
            <div class="panel-heading">
              <div><h3>实时逐句稿</h3></div>
              <div class="panel-heading-meta"><span id="utteranceCount">0 条记录</span><button id="jumpLatest" class="text-button" type="button" hidden>回到最新</button></div>
            </div>
            <div id="transcriptList" class="transcript-list" tabindex="0" aria-live="polite">
              <div id="transcriptEmpty" class="content-empty"><span class="wave-mark"></span><p>开始说话后，原文和中文翻译会在这里逐句出现。</p></div>
            </div>
          </section>
        </section>
      </main>

      <aside class="results-column">
        <section class="result-card summary-card">
          <div class="panel-heading compact"><div><h3>会议纪要</h3></div><span id="summaryBadge" class="badge neutral">等待会议结束</span></div>
          <div id="summaryProgress" class="progress-line" hidden><span id="summaryProgressBar"></span></div>
          <div id="summaryText" class="result-content empty-result">完成会议后，系统会自动整理可审计的中文会议纪要。</div>
          <div class="result-actions"><button id="retrySummary" class="text-button" type="button" hidden>重试会议纪要</button><button id="downloadSummary" class="text-button" type="button" hidden>下载 Markdown</button></div>
        </section>

        <section class="result-card todo-card">
          <div class="panel-heading compact"><div><h3>To-do-list</h3></div><span id="todoBadge" class="badge neutral">等待会议纪要</span></div>
          <div id="todoText" class="todo-content empty-result">会议纪要完成后，系统会从中提取明确的行动项。</div>
          <div class="result-actions"><button id="retryTodo" class="text-button" type="button" hidden>重试 To-do-list</button><button id="downloadTodo" class="text-button" type="button" hidden>下载 JSON</button></div>
        </section>

        <section id="filesCard" class="result-card files-card" hidden>
          <div class="panel-heading compact"><div><h3>本次文件</h3></div></div>
          <div id="fileLinks" class="file-links"></div>
        </section>

      </aside>
    </div>

    <dialog id="newMeetingDialog" class="new-dialog">
      <form method="dialog" id="newMeetingForm">
        <button class="dialog-close" value="cancel" type="submit" aria-label="关闭">×</button>
        <h3>开始新的记录</h3><p class="muted">当前会议仍在进行时不能新建另一场会议。</p>
        <label for="dialogTitle">会议名称</label><input id="dialogTitle" type="text" maxlength="200" placeholder="例如：客户方案评审" />
        <label for="dialogHotwords">专业词、姓名或产品名 <span>可选</span></label><input id="dialogHotwords" type="text" maxlength="2000" placeholder="用逗号分隔" />
        <div class="dialog-actions"><button class="ghost-button" value="cancel" type="submit">取消</button><button id="dialogStart" class="primary-button" value="default" type="submit">开始会议 →</button></div>
      </form>
    </dialog>
    <script type="module" src="/static/app.js?v=6"></script>
  </body>
</html>
